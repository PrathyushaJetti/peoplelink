---
# cPanel Git Version Control: "Deploy HEAD Commit" copies this repository into the live site folder.
# - Never deletes files on the server (no --delete), so uploaded photos, resumes and the live config stay.
# - matrimoney/config.php (live DB password) and uploads are never copied over the live ones.
deployment:
  tasks:
    - export DEPLOYPATH=/home/eliteinterior/public_html/peoplelink/
    - /usr/bin/rsync -a --exclude='.git' --exclude='.cpanel.yml' --exclude='.gitignore' --exclude='matrimoney/config.php' --exclude='matrimoney/db-test.php' --exclude='matrimoney/uploads/' --exclude='_local_setup/' --exclude='*.sql' --exclude='*.zip' --exclude='_smoketest_*.php' ./ $DEPLOYPATH
